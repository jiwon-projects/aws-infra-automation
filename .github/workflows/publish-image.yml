name: Publish container image

on:
  workflow_run:
    workflows: ["Project CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish multi-platform image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/jiwon-projects/aws-infra-automation
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published container image"
            echo
            echo "- Tag: $IMAGE_NAME:$IMAGE_TAG"
            echo "- Digest: $IMAGE_NAME@$IMAGE_DIGEST"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Prepare published image test
        id: release_image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo "API_IMAGE=$IMAGE_NAME@$IMAGE_DIGEST"
            echo "COMPOSE_PROJECT_NAME=release-ci"
            echo "HTTP_BIND_IP=127.0.0.1"
            echo "HTTP_PORT=8082"
            echo "APP_ENV=release-ci"
            echo "APP_VERSION=0.1.0"
          } >> "$GITHUB_ENV"

      - name: Pull and start published image
        run: |
          docker compose -f compose.release.yaml config --quiet
          docker compose -f compose.release.yaml pull
          docker compose -f compose.release.yaml up \
            -d --no-build --pull never --wait --wait-timeout 180

      - name: Test published image responses
        run: |
          curl -fsS --max-time 10 http://127.0.0.1:8082/health/live \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "alive"'

          curl -fsS --max-time 10 http://127.0.0.1:8082/health/ready \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ready"'

          curl -fsS --max-time 10 http://127.0.0.1:8082/api/version \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["environment"] == "release-ci"'

      - name: Check running image reference
        run: |
          API_CONTAINER=$(docker compose -f compose.release.yaml ps -q api)
          RUNNING_IMAGE=$(docker inspect "$API_CONTAINER" --format '{{.Config.Image}}')
          test "$RUNNING_IMAGE" = "$API_IMAGE"

      - name: Check internal communication and API port
        run: |
          docker compose -f compose.release.yaml exec -T nginx \
            wget -qO- http://api:8000/health/live \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "alive"'

          docker inspect "$(docker compose -f compose.release.yaml ps -q api)" \
            --format '{{json .HostConfig.PortBindings}}' \
            | python3 -c 'import json, sys; assert not (json.load(sys.stdin) or {}).get("8000/tcp"), "API port 8000 is published"'

      - name: Record image test result
        run: |
          echo "- Published image execution test: passed (linux/amd64)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Show release container logs
        if: always() && steps.release_image.outcome == 'success'
        run: |
          docker compose -f compose.release.yaml ps -a
          docker compose -f compose.release.yaml logs --no-color --tail=100

      - name: Clean up release containers
        if: always() && steps.release_image.outcome == 'success'
        run: docker compose -f compose.release.yaml down --volumes --remove-orphans