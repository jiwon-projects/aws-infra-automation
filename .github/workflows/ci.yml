name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    name: FastAPI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run API tests
        run: python -m pytest app/tests/ -v

  terraform-check:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Check bootstrap script syntax
        run: bash -n user_data.sh


  docker-test:
    name: Docker integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: ci
      HTTP_BIND_IP: "127.0.0.1"
      HTTP_PORT: "8080"
      APP_ENV: "ci"
      APP_VERSION: "0.1.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Docker tools
        run: |
          docker --version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Test HTTP responses through Nginx
        run: |
          curl -fsS --max-time 10 http://127.0.0.1:8080/health/live \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "alive"'

          curl -fsS --max-time 10 http://127.0.0.1:8080/health/ready \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ready"'

          curl -fsS --max-time 10 http://127.0.0.1:8080/api/version \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["environment"] == "ci"'

      - name: Test container communication
        run: |
          docker compose exec -T nginx wget -qO- http://api:8000/health/live \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["status"] == "alive"'

      - name: Check API port is not published
        run: |
          docker inspect "$(docker compose ps -q api)" --format '{{json .HostConfig.PortBindings}}' \
            | python3 -c 'import json, sys; assert not (json.load(sys.stdin) or {}).get("8000/tcp"), "API port 8000 is published"'

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans